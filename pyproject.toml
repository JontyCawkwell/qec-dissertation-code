[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qec-dissertation"
version = "0.1.0"
description = "Code accompanying a dissertation on permutation-invariant constant-excitation quantum error-correcting codes"
requires-python = ">=3.10"
dependencies = ["numpy", "sympy"]

[tool.pytest.ini_options]
pythonpath = ["."]
